name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify release candidate
        run: npm run verify:release
      - name: Verify Firefox regression
        run: npm run test:e2e:cross-browser
      - name: Verify generated file sync
        run: npm run check:site-sync
      - name: Verify reproducible clean build
        run: git diff --exit-code
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
