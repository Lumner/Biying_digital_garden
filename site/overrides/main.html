{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<script>
(function () {
  var lang = location.pathname.indexOf("/en/") !== -1 ? "en" : "zh";
  var mode = "system";
  var theme = "dark";
  try {
    var storedTheme = localStorage.getItem("biying-theme");
    mode = storedTheme === "light" || storedTheme === "dark" || storedTheme === "system" ? storedTheme : "system";
    var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    theme = mode === "system" ? prefersLight ? "light" : "dark" : mode;
  } catch (error) {
    mode = "system";
    theme = "dark";
  }
  document.documentElement.dataset.biyingLang = lang;
  document.documentElement.dataset.biyingThemeMode = mode;
  document.documentElement.dataset.biyingTheme = theme;
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
})();
</script>
{% endblock %}

{% block announce %}
  <span class="cyber-announce">BIYING ONLINE / 公开内容驱动 / Public knowledge only</span>
{% endblock %}
