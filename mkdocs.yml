site_name: 碧影数字花园
site_description: 一个双语、赛博风格、可对话的个人数字网站。
site_author: Lumner
site_url: https://www.biying.site/
copyright: Copyright &copy; 2026-present 碧影 All Rights Reserved

repo_name: Lumner/Biying_digital_garden
repo_url: https://github.com/Lumner/Biying_digital_garden

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font: false
  favicon: assets/images/favicon.svg
  logo: assets/images/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - 首页: zh/index.md
  - 笔记:
      - 笔记首页: zh/notes/index.md
      - 数学:
          - 分类首页: zh/notes/math.md
          - 离散数学讲义: zh/notes/discrete-math-lecture.md
          - 数学实验: zh/notes/math-lab.md
      - 系统:
          - 分类首页: zh/notes/systems.md
          - 计算机系统基础讲义: zh/notes/computer-systems-lecture.md
      - 算法:
          - 分类首页: zh/notes/algorithms.md
          - FDS 数据结构基础讲义: zh/notes/fds-data-structures-lecture.md
      - AI: zh/notes/ai.md
      - 随笔: zh/notes/essays.md
      - 站点:
          - 分类首页: zh/notes/site.md
          - 公开边界: zh/notes/public-scope.md
      - 标签: zh/notes/tags.md
  - 项目:
      - 项目首页: zh/projects/index.md
      - 个人数字花园与碧影: zh/projects/personal-site-avatar.md
  - 关于: zh/about.md
  - 碧影: zh/avatar/index.md
  - 更多:
      - 现在: zh/now.md
      - 留言: zh/guestbook/index.md
      - 友链: zh/friends.md
      - 注册/登录: zh/register/index.md
      - 隐私: zh/privacy.md
      - 模块更新: zh/updates.md
  - Home: en/index.md
  - Notes:
      - Notes Home: en/notes/index.md
      - Math:
          - Category Home: en/notes/math.md
          - Discrete Mathematics English Overview: en/notes/discrete-math-lecture.md
          - Math Lab: en/notes/math-lab.md
      - Systems:
          - Category Home: en/notes/systems.md
          - Computer Systems English Overview: en/notes/computer-systems-lecture.md
      - Algorithms:
          - Category Home: en/notes/algorithms.md
          - FDS Data Structures English Overview: en/notes/fds-data-structures-lecture.md
      - AI: en/notes/ai.md
      - Essays: en/notes/essays.md
      - Site:
          - Category Home: en/notes/site.md
          - Public Scope: en/notes/public-scope.md
      - Tags: en/notes/tags.md
  - Projects:
      - Projects Home: en/projects/index.md
      - Personal Digital Garden + Biying: en/projects/personal-site-avatar.md
  - About: en/about.md
  - Biying: en/avatar/index.md
  - More:
      - Now: en/now.md
      - Guestbook: en/guestbook/index.md
      - Friends: en/friends.md
      - Account: en/register/index.md
      - Privacy: en/privacy.md
      - Updates: en/updates.md

not_in_nav: |
  index.md
  zh/stats.md
  en/stats.md
  zh/admin/index.md
  en/admin/index.md

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/styles/tokens.css?v=20260718-1
  - assets/styles/themes/dark.css?v=20260718-1
  - assets/styles/base.css?v=20260718-1
  - assets/styles/pages/home.css?v=20260718-1
  - assets/styles/components.css?v=20260718-1
  - assets/styles/pages/notes.css?v=20260718-1
  - assets/styles/pages/projects.css?v=20260718-1
  - assets/styles/layout.css?v=20260718-1
  - assets/styles/pages/chat.css?v=20260718-1
  - assets/styles/pages/account.css?v=20260718-1
  - assets/styles/motion.css?v=20260718-1
  - assets/styles/themes/light.css?v=20260718-1
  - assets/styles/responsive.css?v=20260718-1

extra_javascript:
  - assets/javascripts/language-switch.js?v=20260717-1
  - assets/javascripts/page-meta.js?v=20260717-1
  - assets/javascripts/layout-controls.js?v=20260717-2
  - assets/javascripts/reveal-on-scroll.js?v=20260717-1
  - assets/javascripts/dom-utils.js?v=20260520-1
  - assets/javascripts/i18n.js?v=20260520-1
  - assets/javascripts/api-client.js?v=20260520-1
  - assets/javascripts/auth.js?v=20260717-1
  - assets/javascripts/biying-chat.js?v=20260717-2

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lumner
      name: GitHub
