site_name: 碧影数字花园
site_description: 一个双语、赛博风格、可对话的个人数字网站。
site_author: Lumner
site_url: https://www.biying.site/
copyright: Copyright &copy; 2026-present 碧影 All Rights Reserved

repo_name: Lumner/Biying_digital_garden
repo_url: https://github.com/Lumner/Biying_digital_garden

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  favicon: assets/images/favicon-pikachu.png
  logo: assets/images/favicon-pikachu.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - 首页: zh/index.md
  - 现在: zh/now.md
  - 关于: zh/about.md
  - 笔记:
      - 笔记首页: zh/notes/index.md
      - 公开边界: zh/notes/public-scope.md
      - 数学实验: zh/notes/math-lab.md
      - 离散数学讲义: zh/notes/discrete-math-lecture.md
      - 计算机系统基础讲义: zh/notes/computer-systems-lecture.md
      - FDS 数据结构基础讲义: zh/notes/fds-data-structures-lecture.md
  - 项目:
      - 项目首页: zh/projects/index.md
      - 个人数字花园与碧影: zh/projects/personal-site-avatar.md
  - 注册/登录: zh/register/index.md
  - 碧影: zh/avatar/index.md
  - 留言: zh/guestbook/index.md
  - Home: en/index.md
  - Now: en/now.md
  - About: en/about.md
  - Notes:
      - Notes Home: en/notes/index.md
      - Public Scope: en/notes/public-scope.md
      - Math Lab: en/notes/math-lab.md
      - Discrete Mathematics Lecture Notes: en/notes/discrete-math-lecture.md
      - Computer Systems Fundamentals Lecture Notes: en/notes/computer-systems-lecture.md
      - FDS Data Structures Fundamentals Lecture Notes: en/notes/fds-data-structures-lecture.md
  - Projects:
      - Projects Home: en/projects/index.md
      - Personal Digital Garden + Biying: en/projects/personal-site-avatar.md
  - Account: en/register/index.md
  - Biying: en/avatar/index.md
  - Guestbook: en/guestbook/index.md

not_in_nav: |
  index.md
  zh/admin/index.md
  en/admin/index.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/styles/cyber.css?v=20260515-2

extra_javascript:
  - assets/javascripts/mathjax.js?v=20260515-2
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/language-switch.js?v=20260515-2
  - assets/javascripts/random-note-cover.js?v=20260515-2
  - assets/javascripts/auth.js?v=20260515-2
  - assets/javascripts/biying-chat.js?v=20260515-2
  - assets/javascripts/guestbook.js?v=20260515-2
  - assets/javascripts/admin-dashboard.js?v=20260515-2

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lumner
      name: GitHub
